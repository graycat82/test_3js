<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeeae3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="계산대" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/calculator.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/calculator-180.png" />
    <meta name="description" content="사진을 참고해 만든 장난감 계산대의 Three.js 입체 모형" />
    <title>계산대</title>
  </head>
  <body>
    <main id="app" class="stage" aria-label="계산대 3D 모형" aria-busy="true">
      <div id="viewport" role="img" aria-label="파란색 계산대, 청록색 LCD 프레임, 흰색 숫자 키와 노란색 스캐너의 3D 모형"></div>
      <span id="render-status" class="sr-only" role="status">3D 모형을 준비하고 있습니다</span>
      <output id="calculator-result" class="sr-only" aria-live="polite" aria-atomic="true"></output>
      <nav id="view-controls" aria-label="시점 조작" hidden>
        <button type="button" data-action="zoomIn" aria-label="확대" title="확대">＋</button>
        <button type="button" data-action="zoomOut" aria-label="축소" title="축소">−</button>
        <button type="button" data-action="resetView" aria-label="처음 보기" title="처음 보기">↺</button>
        <button type="button" data-action="overview" aria-label="전체 보기" title="전체 보기">◇</button>
      </nav>
      <div id="render-error" class="render-error" role="alert" hidden>
        <p id="render-error-message"></p>
        <button id="reload-page" type="button">다시 열기</button>
      </div>
      <noscript>3D 모형을 보려면 JavaScript를 활성화해 주세요.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
